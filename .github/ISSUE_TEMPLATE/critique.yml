name: Suggest a change
description: Tell us what was confusing or missing.
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What got in the way?
      description: A screenshot or example helps. You do not need to suggest a fix.
    validations:
      required: true
