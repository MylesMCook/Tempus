name: Product or code critique
description: Identify confusion, unnecessary complexity, or a missing capability.
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do or understand?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What got in the way?
      description: Describe the screen, behavior, or code and its effect. A proposed fix is optional.
    validations:
      required: true
