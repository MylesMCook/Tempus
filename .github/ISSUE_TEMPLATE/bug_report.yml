name: Bug report
description: Report a wrong date, error, or broken interaction.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Remove private information from copied diagnostics."
  - type: textarea
    id: steps
    attributes:
      label: What did you try?
      description: Include the phrase, timezone, captured reference, browser, and steps when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the result or error, and a screenshot if helpful.
    validations:
      required: true
